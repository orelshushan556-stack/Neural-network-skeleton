name: Generate AI Documentation
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Analysis & PDF Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended lmodern python3

      - name: Code Analysis Agent (Python)
        run: |
          python3 - <<'EOF'
          import os
          import re

          def analyze_source_code(directory):
              full_report = ""
              for root, dirs, files in os.walk(directory):
                  for file in sorted(files):
                      if file.endswith((".h", ".cpp")):
                          with open(os.path.join(root, file), 'r') as f:
                              content = f.read()
                              full_report += f"# File Analysis: `{file}`\n\n"
          
                              # 1. Find Classes
                              classes = re.findall(r'class\s+(\w+)', content)
                              for cls in classes:
                                  full_report += f"## Class: **{cls}**\n"
                                  full_report += f"The agent detected a class definition for `{cls}` in this file.\n\n"

                              # 2. Extract Functions and their preceding Comments
                              # This regex looks for documentation blocks followed by function signatures
                              # Matches both /** ... */ and /// style comments
                              doc_blocks = re.findall(r'((?:/\*\*.*?\*/)|(?:(?:///.*?\n)+))\s*([\w:*&\s]+?\s+\w+\s*\(.*?\))', content, re.DOTALL)
          
                              if doc_blocks:
                                  full_report += "### Detailed Function Analysis\n"
                                  for comment, signature in doc_blocks:
                                      clean_comment = comment.replace("/**", "").replace("*/", "").replace("///", "").strip()
                                      full_report += f"- **Signature**: `{signature.strip()}`\n"
                                      full_report += f"  - **Logic Explained**: {clean_comment}\n\n"
                              else:
                                  full_report += "> *No specific documentation comments found for functions in this file. Using standard signature detection.*\n\n"
                                  # Fallback: Just find functions without comments
                                  simple_methods = re.findall(r'(\w+[\s\*&]+\w+\s*\(.*?\))(?=\s*;|\s*\{)', content)
                                  for sm in simple_methods:
                                      if "if" not in sm and "for" not in sm: # filter out keywords
                                          full_report += f"- Identified Function: `{sm.strip()}`\n"
              return full_report

          header = """---
          title: "Autonomous Code Analysis Report"
          author: "Orel Shushan - SCE Software Engineering"
          date: "May 2026"
          geometry: margin=2.5cm
          ---

          # Introduction
          This report was generated by an automated static analysis agent. 
          The agent parsed the C++ source code, extracted class hierarchies, and mapped functional logic from documentation comments.

          """
          
          # Run analysis on your project folder
          analysis_content = analyze_source_code('NeuralNet_Foundation')

          with open('docs/Architecture_Report.md', 'w') as f:
              f.write(header + analysis_content)
          EOF

      - name: Convert Analysis to PDF
        run: |
          mkdir -p docs
          pandoc docs/Architecture_Report.md --toc --number-sections -o docs/Project_Technical_Docs.pdf

      - name: Commit and Push Docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Project_Technical_Docs.pdf
          git commit -m "Update autonomous documentation" || echo "No changes"
          git push origin main