name: Generate AI Documentation
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF & Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended lmodern python3

      - name: Advanced Engineering Agent
        run: |
          python3 - <<'EOF'
          import os
          import re

          def get_explanation(func_name):
              explanations = {
                  "feedForward": "Propagates the input signal through the network layers using the formula $Z = W \cdot A + B$.",
                  "backpropagate": "Calculates gradients using the Chain Rule to minimize the loss function.",
                  "randomize": "Breaks symmetry by initializing weights with small random values, allowing neurons to learn distinct features.",
                  "backward": "Calculates the local gradient for a specific layer and updates parameters using Stochastic Gradient Descent.",
                  "applyReLU": "Applies the non-linear activation function $max(0, x)$ to introduce complex decision boundaries.",
                  "train": "The primary optimization loop. It iterates over the dataset for multiple epochs to refine the model's accuracy."
              }
              return explanations.get(func_name, "Core internal logic for neural computations.")

          def analyze_project(directory):
              full_doc = ""
              for file in sorted(os.listdir(directory)):
                  if file.endswith(".h"):
                      path = os.path.join(directory, file)
                      with open(path, 'r') as f:
                          content = f.read()
                          class_name = re.search(r'class\s+(\w+)', content)
                          if class_name:
                              cls = class_name.group(1)
                              full_doc += f"\n# Architecture: `{cls}` Component\n"
                              full_doc += f"The `{cls}` class is a fundamental building block of the neural engine found in `{file}`.\n\n"
          
                              # Extract real methods, ignore member variables
                              methods = re.findall(r'([\w:*&\s]+?\s+(\w+)\s*\(.*?\))(?=\s*;)', content)
                              full_doc += "## Functional Decomposition\n"
                              for sig, name in methods:
                                  if name not in ['if', 'for', 'while']:
                                      full_doc += f"### Method: `{name}`\n"
                                      full_doc += f"**Signature**: `{sig.strip()}`\n\n"
                                      full_doc += f"**Engineering Context**: {get_explanation(name)}\n\n"
              return full_doc

          header = """---
          title: "Neural Engine: Deep Technical Analysis"
          author: "Orel Shushan - Software Engineering"
          date: "May 2026"
          geometry: margin=2.5cm
          toc: true
          ---

          # 1. Project System Overview
          This report provides a formal decomposition of the Neural Network Skeleton. 
          The engine is designed for high-performance matrix operations and gradient-based learning.

          # 2. Key Engineering Principles
          - **Cache Coherency**: Matrix operations are optimized for sequential memory access.
          - **Move Semantics**: Leveraging C++14 to eliminate redundant memory allocations.
          - **Modular Design**: Separation of Linear Algebra (Matrix) and Neural Logic (Layer/Network).

          # 3. Deep Component Analysis
          """
          
          # Run on core directory
          analysis = analyze_project('NeuralNet_Foundation')
          
          with open('docs/Architecture_Report.md', 'w') as f:
              f.write(header + analysis)
          EOF

      - name: Synthesize Professional PDF
        run: |
          mkdir -p docs
          pandoc docs/Architecture_Report.md --toc --number-sections -o docs/Project_Technical_Docs.pdf

      - name: Update Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Project_Technical_Docs.pdf
          git commit -m "Auto-generate: Comprehensive Technical Analysis" || echo "No changes"
          git push origin main