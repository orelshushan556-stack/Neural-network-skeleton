name: Generate AI Documentation
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF & Doc Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            lmodern \
            python3

      - name: Dynamic Code Analysis & Report Generation
        run: |
          python3 - <<'EOF'
          import os
          import re

          def extract_info(directory):
              report = ""
              for filename in sorted(os.listdir(directory)):
                  if filename.endswith(".h"):
                      with open(os.path.join(directory, filename), 'r') as f:
                          content = f.read()
                          # Find class name
                          class_match = re.search(r'class\s+(\w+)', content)
                          if class_match:
                              class_name = class_match.group(1)
                              report += f"## Class: {class_name}\n"
                              report += f"Found in `{filename}`. This class is a core component of the engine.\n\n"
          
                              # Find public methods
                              methods = re.findall(r'(\w+[\s\*&]+\w+\s*\(.*?\))(?=\s*;|\s*\{)', content)
                              if methods:
                                  report += "### Public Interface:\n"
                                  for m in methods:
                                      report += f"- `{m.strip()}`\n"
                                  report += "\n"
              return report

          header = """---
          title: "Automated Engineering Report: Neural Network Engine"
          author: "Orel Shushan - Software Engineering"
          date: "Generated on: $(date)"
          geometry: margin=2cm
          ---

          # 1. Introduction
          This documentation is automatically generated by analyzing the source code. It reflects the current state of the architecture.

          # 2. Automated Class Analysis
          """
          
          code_details = extract_info('NeuralNet_Foundation')
          
          math_section = """
          # 3. Mathematical Operations
          The engine currently supports:
          - **Forward Propagation**: $Z = W \cdot X + B$
          - **ReLU Activation**: $f(z) = \max(0, z)$
          - **Backpropagation**: Gradient descent optimization.
          """

          with open('docs/Architecture_Report.md', 'w') as f:
              f.write(header + code_details + math_section)
          EOF

      - name: Create Professional PDF
        run: |
          mkdir -p docs
          pandoc docs/Architecture_Report.md --toc --number-sections -o docs/Project_Technical_Docs.pdf

      - name: Push to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Project_Technical_Docs.pdf
          git commit -m "Auto-generated report from source code analysis" || echo "No changes"
          git push origin main