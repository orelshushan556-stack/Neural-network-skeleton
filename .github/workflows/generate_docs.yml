name: Generate AI Documentation
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF & Doc Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            lmodern

      - name: Generate Technical Report
        run: |
          mkdir -p docs
          # Using printf to safely handle backslashes for LaTeX
          printf -- '---\ntitle: "Neural Network Engine - Technical Documentation"\nauthor: "Orel Shushan - Software Engineering"\ndate: "%s"\ngeometry: margin=2cm\n---\n\n' "$(date)" > docs/Architecture_Report.md
          
          printf -- '# 1. Project Overview\nThis project implements a fully functional Neural Network engine from scratch using C++.\n\n' >> docs/Architecture_Report.md
          
          printf -- '## 1.1 Core Philosophy\n- **Zero Dependency**: Standard C++ libraries only.\n- **Manual Memory**: Move Semantics (O(1)).\n- **Efficiency**: Optimized Matrix operations.\n\n' >> docs/Architecture_Report.md
          
          printf -- '# 2. Architecture\n\n## 2.1 Matrix Engine\nCustom linear algebra engine with move constructors.\n\n## 2.2 Layer Class\nManaged weights, biases, and ReLU activation.\n\n' >> docs/Architecture_Report.md
          
          printf -- '# 3. Mathematical Foundations\n\nForward Pass:\n\n$$Z = W \\cdot X + B$$\n\n$$A = \\text{ReLU}(Z)$$\n\n' >> docs/Architecture_Report.md
          
          printf -- 'Backward Pass (Gradient Descent):\n\n$$\\nabla W = \\text{error} \\cdot X^T$$\n\n' >> docs/Architecture_Report.md
          
          printf -- '# 4. Current Status\n- **XOR Problem**: Solved.\n- **Automation**: PDF auto-generated.\n\n---\n*Last Update: %s*' "$(date)" >> docs/Architecture_Report.md

      - name: Create Professional PDF
        run: |
          pandoc docs/Architecture_Report.md --toc -o docs/Project_Technical_Docs.pdf

      - name: Push to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Project_Technical_Docs.pdf
          git commit -m "Fix LaTeX formatting in PDF" || echo "No changes"
          git push origin main