name: Generate AI Documentation
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF & Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            lmodern \
            python3

      - name: Autonomous Engineering Agent (Source Code Parser)
        run: |
          python3 - <<'EOF'
          import os
          import re

          def clean_text(text):
              # Remove any non-ASCII characters (like Hebrew) to prevent LaTeX errors
              return "".join(i for i in text if ord(i) < 128)

          def analyze_project(directory):
              report = ""
              for root, dirs, files in os.walk(directory):
                  for file in sorted(files):
                      if file.endswith((".h", ".cpp")):
                          report += f"\n# Module Analysis: `{file}`\n\n"
                          with open(os.path.join(root, file), 'r', errors='ignore') as f:
                              content = f.read()
          
                              # 1. Detect Classes
                              classes = re.findall(r'class\s+(\w+)', content)
                              for cls in classes:
                                  report += f"## Architecture: Class `{cls}`\n"
                                  report += f"The agent detected the structural definition of `{cls}` in this module. This component manages specific neural operations.\n\n"

                              # 2. Extract Methods and Doc-Comments
                              # Looks for /** */ or /// blocks followed by function signatures
                              docs = re.findall(r'((?:/\*\*.*?\*/)|(?:(?:///.*?\n)+))\s*([\w:*&\s]+?\s+\w+\s*\(.*?\))', content, re.DOTALL)
          
                              if docs:
                                  report += "### Technical Implementation Details\n"
                                  for comment, sig in docs:
                                      # Clean the extraction
                                      clean_comment = comment.replace("/**","").replace("*/","").replace("///","").strip()
                                      clean_comment = clean_text(clean_comment)
                                      clean_sig = clean_text(sig.strip())
          
                                      report += f"#### Function: `{clean_sig}`\n"
                                      report += f"**Developer Intent**: {clean_comment}\n\n"
                              else:
                                  # Fallback: Just list important functions if no comments exist
                                  methods = re.findall(r'(\w+[\s\*&]+\w+\s*\(.*?\))(?=\s*;|\s*\{)', content)
                                  if methods:
                                      report += "### Identified Interface Methods\n"
                                      for m in methods:
                                          if not any(k in m for k in ['if', 'for', 'while', 'switch']):
                                              report += f"- `{clean_text(m.strip())}`\n"
                                      report += "\n"
              return report

          header = """---
          title: "Neural Network Skeleton: Autonomous Technical Report"
          author: "Orel Shushan - Software Engineering"
          date: "May 2026"
          geometry: margin=2.5cm
          toc: true
          numbersections: true
          ---

          # Project Executive Summary
          This document is an autonomous technical decomposition of the Neural Network engine. 
          The analysis agent has parsed the source code to map the mathematical architecture and memory management strategies.

          # Engineering Foundations
          The project is built on C++14 standards, focusing on:
          - **Manual Memory Management**: Implementation of Move Semantics for performance.
          - **Mathematical Precision**: Custom Linear Algebra engine for neural computations.
          - **Static Analysis**: Documentation generated via CI/CD pipelines.

          """
          
          # Target the core logic directory
          project_analysis = analyze_project('NeuralNet_Foundation')
          
          with open('docs/Architecture_Report.md', 'w') as f:
              f.write(header + project_analysis)
          EOF

      - name: Synthesize Professional PDF
        run: |
          mkdir -p docs
          # Using pdflatex (safe for ASCII/English)
          pandoc docs/Architecture_Report.md --toc --number-sections -o docs/Project_Technical_Docs.pdf

      - name: Update Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Project_Technical_Docs.pdf
          # If no changes, the workflow will finish gracefully
          git commit -m "Auto-update: Synthesized Technical Report [English Only]" || echo "No changes"
          git push origin main